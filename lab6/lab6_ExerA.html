<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, Paper, Scissors</title>
    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <!-- Player Section -->
    <section class="card">
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" placeholder="Enter your name">
        <button onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </section>

    <!-- Game Section -->
    <section class="card">
        <div class="choices">
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>
        </div>

        <div class="arena">
            <div>
                <h3>You</h3>
                <img id="playerImg" src="rock.png" alt="Player Choice">
            </div>
            <h2 class="vs">VS</h2>
            <div>
                <h3>Computer</h3>
                <img id="computerImg" src="rock.png" alt="Computer Choice">
            </div>
        </div>
    </section>

    <!-- Result and Scoreboard Section -->
    <section class="card">
        <p id="result"></p>
        <p class="scoreboard">
            Wins: <span id="wins">0</span> &nbsp;&nbsp;
            Losses: <span id="losses">0</span> &nbsp;&nbsp;
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- History Section -->
    <section class="card">
        <h2>History</h2>
        <table id="history">
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
        </table>

        <div class="controls">
            <button onclick="showSummary()">Show Summary</button>
            <button onclick="resetGame()">Reset</button>
        </div>
        <p id="summary"></p>
    </section>

    <!-- Footer Section -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Linking external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
